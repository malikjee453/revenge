[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binxray"
version = "0.1.0"
description = "BinXray: static analysis toolkit (web UI, CLI, MCP server) for binaries, apps, model files and captures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
binxray = "binxray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
