[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-py"
version = "0.1.0"
description = "Python reimplementation of the static-analysis core of REA (Reverse Engineer Anything): an MCP server and CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rea-py = "rea_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
